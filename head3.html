<script id="pwa-install">
/* v0.31: installable app (Lee). Android/desktop Chrome get an Install button; iPhone gets the Share tip. */
(function(){try{if(location.protocol!=='file:'&&'serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}
var dp=null;var standalone=(window.matchMedia&&matchMedia('(display-mode: standalone),(display-mode: fullscreen)').matches)||navigator.standalone;
var ios=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;
function btn(){var t=document.getElementById('title');if(!t)return null;var b=document.getElementById('btnInstall');if(!b){var links=t.querySelector('#btnLesson');b=document.createElement('button');b.type='button';b.id='btnInstall';b.className='tl-link tl-install';b.hidden=true;if(links&&links.parentNode)links.parentNode.insertBefore(b,links);else return null;}return b;}
function show(){if(standalone)return;var b=btn();if(!b)return;if(dp){b.textContent='Install TOPS as an app · full screen';b.hidden=false;b.onclick=function(){dp.prompt();dp.userChoice.then(function(){dp=null;b.hidden=true;});};}
 else if(ios){b.textContent='Play full screen: tap Share, then Add to Home Screen';b.hidden=false;b.onclick=null;}}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e;show();});
window.addEventListener('appinstalled',function(){var b=document.getElementById('btnInstall');if(b)b.hidden=true;});
document.addEventListener('DOMContentLoaded',function(){setTimeout(show,1500);});
})();
</script>
