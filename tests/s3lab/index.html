 tops:{name:'TOPS Toon',ref:'Team Fortress 2, Wii Sports',kind:'toon',ramp:rampTex([140,205,255]),flat:true,ink:{px:2.2,col:0x1b1418},shirtPlane:true,bg:0xf4f3ef,tone:true,exp:.8,hemi:.28,key:1.5,fill:.38,rim:.7,shadow:.16},

  if(o.metalness||o.transparent)return new T.MeshStandardMaterial(Object.assign({color:col,flatShading:true,roughness:.8,metalness:0},o));

  if(S.kind==='toon')m=new T.MeshToonMaterial(Object.assign(base,{gradientMap:S.ramp,flatShading:S.flat}));
  else if(S.kind==='phong')m=new T.MeshPhongMaterial(Object.assign(base,{flatShading:S.flat,shininess:4,specular:new T.Color(0x000000)}));
  else if(S.kind==='lambert')m=new T.MeshLambertMaterial(base);

    const v=tp.clone().sub(throwFrom).normalize();v.y+=.35*Math.cos(k*Math.PI);flyer.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),v.normalize());}
  else {flyer.visible=false;throwFrom=null;}},
 celebrate(t){// fist pump at the chest, like the record moment
  const r=rig;const u=(t%2.2)/2.2;const k=u<.2?ease(u/.2):u<.7?1:1-ease((u-.7)/.3);const shake=Math.sin(t*16)*.06*(u>.2&&u<.7?1:0);
  r.root.position.z=0;r.root.rotation.y=0;r.dart.visible=false;
  r.aL.sh.rotation.set(lerp(-.1,-1.25,k)+shake,0,lerp(-.1,-.25,k));r.aL.el.rotation.x=lerp(-.15,-2.1,k);r.aL.wr.rotation.x=-.3*k;
  r.aR.sh.rotation.set(-.15,0,.12);r.aR.el.rotation.x=-.25;
  r.chest.rotation.x=lerp(0,-.12,k);r.head.rotation.x=lerp(0,-.25,k);r.spine.rotation.x=lerp(0,.06,k);
  r.lL.th.rotation.x=-.06;r.lR.th.rotation.x=.06;r.hips.position.y=.86*r.S-.02*k;}
};

function placeCam(){const V=curV();if(V){const F=plateFit();cam.fov=2*Math.atan((F.h/F.ph)*Math.tan(V.cam.fov*Math.PI/360))*180/Math.PI;cam.updateProjectionMatrix();cam.position.set(...V.cam.pos);cam.lookAt(...V.cam.look);return;}const th=anim==='throw';const y=th?Math.PI/2+(yaw-.35):yaw;tgt.z=th?1.12:0;tgt.y=th?1.12:(camTY??.82);let dd=dist;if(th){const hf=Math.atan(Math.tan(cam.fov*Math.PI/360)*cam.aspect);dd=Math.max(3.6,1.65/Math.tan(hf))*dist/5.1;}cam.position.set(tgt.x+dd*Math.sin(y)*Math.cos(pitch),tgt.y+dd*Math.sin(pitch)+.15,tgt.z+dd*Math.cos(y)*Math.cos(pitch));cam.lookAt(tgt);}

 else if(pts.size===2){const [a,b]=[...pts.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch)dist=Math.max(2.2,Math.min(8,dist*pinch/d));pinch=d;}});

const csTex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(0,0,0,.85)');gr.addColorStop(.45,'rgba(0,0,0,.45)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);return new T.CanvasTexture(c);})();

// clipping check (Season 3 test): every inner mesh stays under the mesh that covers it, in every pose.
// pants under the shirt above the hem; upper-arm skin under the sleeve; cuff and stripe outside the sleeve; collar stand hugging the neck
function clipCheck(){const out={pants:0,arm:0,cuff:0,collar:0,trim:0,checked:0,worst:{}};P.updateMatrixWorld(true);
 const byTag=t=>{const r=[];P.traverse(o=>{if(o.isMesh&&o.userData.tag===t)r.push(o);});return r;};
 const prox=o=>{const m=new T.Mesh(o.geometry,new T.MeshBasicMaterial({side:T.DoubleSide}));m.matrixWorld.copy(o.matrixWorld);m.matrixAutoUpdate=false;return m;};
 const rc=new T.Raycaster(),p=new T.Vector3(),l=new T.Vector3(),ax=new T.Vector3(),d=new T.Vector3(),inv=new T.Matrix4();
 // signed depth of p below the cover along the ray from the frame's axis (positive = covered)
 const depth=(p,frame,covers)=>{inv.copy(frame.matrixWorld).invert();l.copy(p).applyMatrix4(inv);ax.set(0,l.y,0).applyMatrix4(frame.matrixWorld);d.copy(p).sub(ax);const dist=d.length();if(dist<1e-4)return 1;d.normalize();rc.far=dist+.5;let h=[];for(const j of [0,.004,-.004,.009]){const dd=d.clone().applyAxisAngle(new T.Vector3(0,1,0),j);rc.set(ax,dd);h=rc.intersectObjects(covers,false);if(h.length)break;}/* a ray exactly along a lathe seam can slip between triangles: nudge and retry */if(!h.length)return -1;return h[h.length-1].distance-dist;};
 const verts=(o,fn)=>{const g=o.geometry.attributes.position;for(let i=0;i<g.count;i+=1){p.fromBufferAttribute(g,i).applyMatrix4(o.matrixWorld);fn(p);}};
 const worst=(k,v)=>{out.worst[k]=Math.min(out.worst[k]??1,v);};out.ex=[];const ex=(k,q,fr,dp)=>{if(out.ex.length<12){inv.copy(fr.matrixWorld).invert();const u=q.clone().applyMatrix4(inv);out.ex.push(k+' '+[u.x,u.y,u.z].map(v=>v.toFixed(3)).join(',')+' d='+dp.toFixed(4));}};const pole=(q,fr)=>{inv.copy(fr.matrixWorld).invert();const u=q.clone().applyMatrix4(inv);return Math.hypot(u.x,u.z)<.006;};
 const chest=rig.chest,shirt=byTag('shirt').map(prox);
 const hipsI=new T.Matrix4().copy(rig.hips.matrixWorld).invert();byTag('pants').forEach(o=>verts(o,q=>{/* the hem follows the hips, so 'above the hem' is measured in the hips frame */const y=l.copy(q).applyMatrix4(hipsI).y;if(y<-.098||y>.3)return;if(pole(q,chest))return;out.checked++;const dp=depth(q,chest,shirt);worst('pants',dp);if(dp<.001){out.pants++;ex('pants',q,chest,dp);}}));
 [rig.aL,rig.aR].forEach(A=>{const sl=[];A.sh.children.forEach(o=>{if(o.userData.tag==='sleeve')sl.push(prox(o));});
  A.sh.children.forEach(o=>{if(o.userData.tag==='upperarm')verts(o,q=>{inv.copy(A.sh.matrixWorld).invert();const y=l.copy(q).applyMatrix4(inv).y;if(y<-.158)return;if(pole(q,A.sh))return;out.checked++;const dp=depth(q,A.sh,sl);worst('arm',dp);if(dp<.0008){out.arm++;ex('arm',q,A.sh,dp);}});
   if(o.userData.tag==='cuff')verts(o,q=>{out.checked++;const dp=depth(q,A.sh,sl);worst('cuff',-dp);if(dp>-.0008)out.cuff++;});});});
 ['fold','placket'].forEach(tg=>byTag(tg).forEach(o=>verts(o,q=>{if(pole(q,chest))return;out.checked++;const dp=depth(q,chest,shirt);worst('trim',-dp);if(dp>-.0005){out.trim++;ex(tg,q,chest,dp);}})));
 const nk=byTag('neck').map(prox);byTag('collar').forEach(o=>verts(o,q=>{out.checked++;const dp=depth(q,chest,nk);/* dp<0: collar outside the neck by -dp */worst('collar',-Math.abs(dp));if(-dp>.008){out.collar++;ex('collar',q,chest,dp);}}));
 return out;}
