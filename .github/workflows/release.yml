# TOPS release from a QA pass (SHIP-3b, then SHIP-4: every risk class + the rule-2 new-combination check, 12 Nov).
# Dispatch with tools/dispatch-release.sh (it cancels queued release runs first for an R0, then dispatches and waits).
# Rules: a QA PASS line names (commit, tree). If commit merged onto the CURRENT src gives that tree, release as is.
# If src has moved since the pass, `base` must be the src commit QA merged onto: the workflow proves QA's tree from
# (base + commit), merges onto the current src, runs the item's named `tests` + regress.js 2 in a separate copy, and
# releases only if all pass. Items that touch sql/ need migration=applied. main is the release record
# (RELEASES.log: prepared -> live|failed); rollback runs inside this run and redeploys the last *live* release's ref.
name: release
run-name: "${{ inputs.risk }} | ${{ inputs.item }} | commit=${{ inputs.commit }} | tree=${{ inputs.tree }} | base=${{ inputs.base }} | tests=${{ inputs.tests }} | migration=${{ inputs.migration }} | mode=${{ inputs.mode }}"
on:
  workflow_dispatch:
    inputs:
      commit: { description: 'QA-passed commit (sha on this repo)', required: true }
      tree:   { description: 'QA-tested source tree hash (pre-bump)', required: true }
      risk:   { description: 'R0, R1, R2 or R3 (from the QA PASS line)', required: true }
      attest: { description: 'Type exactly: QA PASS names this tree', required: true }
      base:   { description: 'src commit QA merged onto (needed only if src has moved since the pass)', required: false, default: '' }
      tests:  { description: 'Item tests for the new-combination check, space-separated paths (regress.js 2 always runs)', required: false, default: '' }
      migration: { description: 'none, or applied (required when the release changes sql/)', required: false, default: 'none' }
      item:   { description: 'Item name for the release log', required: true }
      mode: { description: 'dry_run = gate + build only, nothing pushed; release; test_rollback = TEST ONLY: deploy, then fail the live check on purpose', type: choice, options: [dry_run, release, test_rollback], default: dry_run }
      version: { description: 'Optional exact version (X.YY), e.g. a jump the old 2.0x version gate reads as newer; must be higher than the current one. Empty = next hundredth', required: false, default: '' }
concurrency:
  group: tops-production-release
  queue: max
  cancel-in-progress: false
permissions: { contents: read }
jobs:
  gate_build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      mode: ${{ steps.gate.outputs.mode }}
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Check inputs
        env: { RISK: '${{ inputs.risk }}', ATTEST: '${{ inputs.attest }}', MIG: '${{ inputs.migration }}', TESTS: '${{ inputs.tests }}' }
        run: |
          case "$RISK" in R0|R1|R2|R3) ;; *) echo "::error::REFUSED: risk '$RISK' is not R0-R3"; exit 1;; esac
          [ "$ATTEST" = "QA PASS names this tree" ] || { echo "::error::REFUSED: attest input missing or wrong"; exit 1; }
          case "$MIG" in none|applied) ;; *) echo "::error::REFUSED: migration must be none or applied"; exit 1;; esac
          case "${{ inputs.item }}" in *'|'*) echo "::error::REFUSED: item name must not contain '|' (the run name carries the inputs)"; exit 1;; esac
          for t in $TESTS; do echo "$t" | grep -qE '^tests/[A-Za-z0-9_.-]+\.js$' || { echo "::error::REFUSED: test '$t' is not tests/<name>.js"; exit 1; }; done
      - uses: actions/checkout@v4
        with: { ref: main, path: site, fetch-depth: 1 }
      - uses: actions/checkout@v4
        with: { ref: src, path: src, fetch-depth: 0 }
      - name: Gate (QA tree, inside the lock, against the current remote src)
        id: gate
        env: { COMMIT: '${{ inputs.commit }}', TREE: '${{ inputs.tree }}', BASE: '${{ inputs.base }}', MIG: '${{ inputs.migration }}' }
        run: |
          cd src
          git config user.name "tops-release"; git config user.email "tops-release@users.noreply.github.com"
          git fetch -q origin "$COMMIT" || { echo "::error::REFUSED: commit $COMMIT not found on this repo"; exit 1; }
          C=$(git rev-parse "$COMMIT"); T=$(git rev-parse "$C^{tree}")
          LOG=../site/RELEASES.log; touch $LOG
          if grep -q " live .*tree=${TREE}" $LOG; then echo "mode=noop" >> $GITHUB_OUTPUT; echo "::notice::tree $TREE is already live; nothing to do"; exit 0; fi
          if git merge-base --is-ancestor origin/src "$C"; then
            git checkout -q --detach "$C"
          else
            git checkout -q --detach origin/src
            git merge -q --no-edit "$C" || { echo "::error::REFUSED: merge conflict onto src"; exit 1; }
          fi
          GOT=$(git rev-parse HEAD^{tree})
          [ "$GOT" != "$(git rev-parse origin/src^{tree})" ] || { echo "mode=noop" >> $GITHUB_OUTPUT; echo "::notice::commit is already in src; nothing new to release"; exit 0; }
          case "$GOT" in
            "$TREE"*) echo "recheck=false" >> $GITHUB_OUTPUT
                      echo "candidate $(git rev-parse --short HEAD) tree $GOT = QA $TREE (exact)" >> $GITHUB_STEP_SUMMARY ;;
            *) [ -n "$BASE" ] || { echo "::error::REFUSED: tree mismatch: QA $TREE, candidate $GOT. src has moved since the pass: dispatch again with base=<src commit QA merged onto>"; exit 1; }
               CAND=$(git rev-parse HEAD)
               git fetch -q origin "$BASE" 2>/dev/null || true
               B=$(git rev-parse --verify -q "$BASE^{commit}") || { echo "::error::REFUSED: base $BASE not found"; exit 1; }
               git merge-base --is-ancestor "$B" origin/src || { echo "::error::REFUSED: base $BASE is not an earlier src commit"; exit 1; }
               git checkout -q --detach "$B"
               if ! git merge-base --is-ancestor "$B" "$C"; then git merge -q --no-edit "$C" || { echo "::error::REFUSED: commit does not merge onto base"; exit 1; }; else git checkout -q --detach "$C"; fi
               QT=$(git rev-parse HEAD^{tree})
               case "$QT" in "$TREE"*) ;; *) echo "::error::REFUSED: base + commit gives tree $QT, not QA's $TREE (wrong base or commit)"; exit 1;; esac
               git checkout -q --detach "$CAND"
               [ -n "${{ inputs.tests }}" ] || { echo "::error::REFUSED: src has moved since the pass, so the item's tests must be named (tests=tests/x.js ...) for the new-combination check"; exit 1; }
               echo "recheck=true" >> $GITHUB_OUTPUT
               { echo "QA's tree $TREE reproduced from base $(git rev-parse --short $B) + commit."; echo "src has moved: new combination $(git rev-parse --short HEAD) tree $GOT, so the item's tests + regress.js 2 run before release."; } >> $GITHUB_STEP_SUMMARY ;;
          esac
          CH=$(git diff --name-only origin/src HEAD -- sql/ | tr '\n' ' ')
          if [ -n "$CH" ] && [ "$MIG" != "applied" ]; then echo "::error::REFUSED: this release changes $CH; apply the migration first, then dispatch with migration=applied"; exit 1; fi
          [ -n "$CH" ] && echo "migration(s) marked applied: $CH" >> $GITHUB_STEP_SUMMARY
          echo "mode=new" >> $GITHUB_OUTPUT
          echo "base=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "cand_tree=$GOT" >> $GITHUB_OUTPUT
          { echo "| | |"; echo "|---|---|"; echo "| item commit | \`$C\` |"; echo "| QA tree | \`$TREE\` |"; echo "| release candidate | \`$(git rev-parse --short HEAD)\` tree \`$GOT\` |"; echo "| src at gate | \`$(git rev-parse --short origin/src)\` |"; echo "| migration | ${MIG} |"; } >> $GITHUB_STEP_SUMMARY
      - name: Allocate version (integer hundredths) and bump
        id: ver
        if: steps.gate.outputs.mode == 'new'
        env: { ITEM: '${{ inputs.item }}', WANT: '${{ inputs.version }}' }
        run: |
          cd src
          CUR=$(grep -o "TOPS_VER='[0-9.]*'" v051.js | head -1 | grep -o "[0-9.]*")
          LOGMAX=$(grep -o "version=[0-9.]*" ../site/RELEASES.log | cut -d= -f2 | sort -V | tail -1)
          HI=$(printf '%s\n%s\n' "$CUR" "${LOGMAX:-0}" | sort -V | tail -1)
          H=$(echo "$HI" | awk -F. '{printf "%d", $1*100+$2}'); N=$((H+1)); V=$(printf '%d.%02d' $((N/100)) $((N%100)))
          if [ -n "$WANT" ]; then
            echo "$WANT" | grep -qE '^[0-9]+\.[0-9]{2}$' || { echo "::error::REFUSED: version '$WANT' is not X.YY"; exit 1; }
            WH=$(echo "$WANT" | awk -F. '{printf "%d", $1*100+$2}')
            [ "$WH" -gt "$H" ] || { echo "::error::REFUSED: version $WANT is not higher than $HI"; exit 1; }
            V=$WANT
          fi
          sed -i "s/TOPS_VER='[0-9.]*'/TOPS_VER='$V'/" v051.js
          git commit -qam "v$V: $ITEM (release run ${{ github.run_id }})"
          echo "version=$V" >> $GITHUB_OUTPUT; echo "tag=rel-$V" >> $GITHUB_OUTPUT
          git bundle create ../src.bundle origin/src..HEAD
          echo "version $V" >> $GITHUB_STEP_SUMMARY
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.mode == 'new'
        with: { node-version: '20' }
      - name: New-combination check (rule 2) - item tests + regress.js 2 in a separate copy
        if: steps.gate.outputs.mode == 'new' && steps.gate.outputs.recheck == 'true'
        env: { TESTS: '${{ inputs.tests }}' }
        run: |
          # separate worktree: tests/setup.sh copies main's assets over the working tree, which must not reach the release build
          cd src && git worktree add -q ../chk HEAD && cd ../chk
          # exact pins, the same as CI and QA's boxes (playwright 1.48.2 pins its own Chromium build)
          npm i --no-save --no-package-lock three@0.128.0 playwright@1.48.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          echo "recheck tools: node $(node -v), three $(node -p "require('three/package.json').version"), playwright $(node -p "require('playwright/package.json').version")" | tee ../chk.log
          bash tests/setup.sh
          fail=
          for t in $TESTS; do
            [ -f "$t" ] || { echo "::error::RECHECK: $t not found in the release tree"; fail=1; continue; }
            echo "== $t" | tee -a ../chk.log
            node "$t" "$PWD" 2>&1 | tail -20 | tee -a ../chk.log; [ "${PIPESTATUS[0]}" = 0 ] || { echo "::error::RECHECK FAILED: $t"; fail=1; }
          done
          echo "== tests/regress.js 2" | tee -a ../chk.log
          node tests/regress.js 2 2>&1 | tail -20 | tee -a ../chk.log; [ "${PIPESTATUS[0]}" = 0 ] || { echo "::error::RECHECK FAILED: regress.js 2"; fail=1; }
          { echo "### New-combination check"; echo '```'; tail -40 ../chk.log; echo '```'; } >> $GITHUB_STEP_SUMMARY
          [ -z "$fail" ] || { echo "::error::NOT RELEASED: the new combination failed its checks; tell the builder and QA (run ${{ github.run_id }})"; exit 1; }
      - name: Release identity (the build is the gated candidate + the version bump, nothing else)
        if: steps.gate.outputs.mode == 'new'
        env: { CT: '${{ steps.gate.outputs.cand_tree }}' }
        run: |
          cd src
          [ "$(git rev-parse HEAD~1^{tree})" = "$CT" ] || { echo "::error::IDENTITY: release parent tree is not the gated candidate $CT"; exit 1; }
          [ "$(git diff --name-only HEAD~1 HEAD)" = "v051.js" ] || { echo "::error::IDENTITY: the release commit changes more than v051.js"; exit 1; }
          [ -z "$(git status --porcelain --untracked-files=no)" ] || { echo "::error::IDENTITY: tracked files changed in the release checkout (test setup leaked?)"; git status --short | head; exit 1; }
          echo "identity: release $(git rev-parse --short HEAD) = candidate tree ${CT:0:7} + version bump only" >> $GITHUB_STEP_SUMMARY
      - name: Build (same steps as ship.sh)
        if: steps.gate.outputs.mode == 'new'
        run: |
          cd src
          npm i --no-save three@0.128.0 >/dev/null
          node build.js
          V=${{ steps.ver.outputs.version }}
          mkdir -p ../out/next ../out/assets/ui ../out/assets/voice ../out/img
          cp double-out-standalone.html ../out/index.html
          python3 -c "import sys;s=open(sys.argv[1],encoding='utf-8').read().replace('<meta charset=\"utf-8\">','<meta charset=\"utf-8\"><base href=\"../\">',1);open(sys.argv[2],'w',encoding='utf-8').write(s)" double-out-standalone.html ../out/next/index.html
          echo "{\"v\":\"$V\"}" > ../out/version.json
          cp assets/ui/* ../out/assets/ui/ 2>/dev/null || true
          cp assets/voice/* ../out/assets/voice/ 2>/dev/null || true
          cp img/menu_*.jpg ../out/img/ 2>/dev/null || true
          grep -q "TOPS_VER='$V'" ../out/index.html || { echo "::error::BUILD: index.html does not carry $V"; exit 1; }
          # ENG-RIGCACHE: the page loads its rig from rig/remy-<sha8>.glb (immutable; <sha8> = first 8 hex of the file's sha256).
          # Publish exactly the file the page names, and prove name = content. No-op while the page names no rig. (run shell is bash -eo pipefail)
          RIG=$( { grep -o 'rig/remy-[0-9a-f]\{8\}\.glb' ../out/index.html || true; } | sort -u)
          WROTE=$( { find rig -maxdepth 1 -name 'remy-*.glb' 2>/dev/null || true; } | sort | tr '\n' ' ')
          if [ -z "$RIG" ]; then
            [ -z "$WROTE" ] || { echo "::error::BUILD: build.js wrote $WROTE but the page names no rig/remy-<sha8>.glb (the page must carry the literal name)"; exit 1; }
          else
            [ "$(echo "$RIG" | wc -l)" = 1 ] || { echo "::error::BUILD: the page names more than one rig file: $RIG"; exit 1; }
            [ -s "$RIG" ] || { echo "::error::BUILD: the page loads $RIG but build.js did not write it"; exit 1; }
            H=$(sha256sum "$RIG" | cut -c1-8); [ "rig/remy-$H.glb" = "$RIG" ] || { echo "::error::BUILD: $RIG has content hash $H (stale or edited rig file)"; exit 1; }
            mkdir -p ../out/rig && cp "$RIG" ../out/rig/
            echo "rig: $RIG $(wc -c < "$RIG") bytes" >> $GITHUB_STEP_SUMMARY
          fi
          echo "built index.html $(wc -c < ../out/index.html) bytes, sha256 $(sha256sum ../out/index.html | cut -c1-16)" >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.mode == 'new'
        with: { name: release-files, path: 'out/**', retention-days: 30, include-hidden-files: true }
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.mode == 'new'
        with: { name: src-bundle, path: src.bundle, retention-days: 30 }
      - name: Dry run stops here
        if: inputs.mode == 'dry_run' && steps.gate.outputs.mode == 'new'
        run: |
          echo "DRY RUN - gate and build passed for v${{ steps.ver.outputs.version }}; nothing pushed, tagged or deployed." >> $GITHUB_STEP_SUMMARY

  publish:
    needs: gate_build
    if: ${{ inputs.mode != 'dry_run' && needs.gate_build.outputs.mode == 'new' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: write, pages: write, id-token: write }
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    env: { V: '${{ needs.gate_build.outputs.version }}', TAG: '${{ needs.gate_build.outputs.tag }}', ITEM: '${{ inputs.item }}', QTREE: '${{ inputs.tree }}', QCOMMIT: '${{ inputs.commit }}', RISK: '${{ inputs.risk }}' }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: site, fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { name: release-files, path: out }
      - uses: actions/download-artifact@v4
        with: { name: src-bundle, path: . }
      - name: Record the release on main (prepared) and tag it
        run: |
          cd site
          git config user.name "tops-release"; git config user.email "tops-release@users.noreply.github.com"
          cp -r ../out/. .
          echo "$(date -u +%FT%TZ) prepared version=$V tag=$TAG tree=$QTREE commit=$QCOMMIT risk=$RISK run=${{ github.run_id }} item=$ITEM" >> RELEASES.log
          git add -A index.html version.json next assets img RELEASES.log
          if [ -d rig ]; then git add -A rig; fi   # rig/: hashed rig files, only ever added; a rollback leaves them (the previous page keeps its own)
          git commit -qm "v$V: $ITEM (release run ${{ github.run_id }}, prepared)"
          git tag -a "$TAG" -m "v$V $ITEM tree $QTREE"
          git push -q origin HEAD:main "$TAG" || { echo "::error::SYNC: push to main failed; nothing deployed"; exit 1; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Live check (version.json cache-busted, then a headless load with no page errors)
        id: live
        run: |
          U="${{ steps.deploy.outputs.page_url }}"
          ok=; for i in $(seq 1 36); do g=$(curl -fsS "${U}version.json?cb=$RANDOM$i" | grep -o '"v":"[0-9.]*"' | cut -d'"' -f4); [ "$g" = "$V" ] && { ok=1; break; }; sleep 5; done
          [ -n "$ok" ] || { echo "::error::LIVE: version.json never showed $V (last: $g)"; exit 1; }
          RIG=$( { grep -o 'rig/remy-[0-9a-f]\{8\}\.glb' out/index.html || true; } | sort -u)
          if [ -n "$RIG" ]; then
            curl -fsS -o live_rig.glb "${U}${RIG}" || { echo "::error::LIVE: ${U}${RIG} did not download"; exit 1; }
            [ "$(sha256sum < live_rig.glb)" = "$(sha256sum < "out/$RIG")" ] || { echo "::error::LIVE: ${U}${RIG} is not the released rig ($(wc -c < live_rig.glb) bytes)"; exit 1; }
            echo "LIVE: $RIG served, sha256 matches ($(wc -c < live_rig.glb) bytes)" >> $GITHUB_STEP_SUMMARY
          fi
          npm i --no-save playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          node -e "const {chromium}=require('playwright');(async()=>{const b=await chromium.launch();const p=await b.newPage({viewport:{width:390,height:844}});const e=[];p.on('pageerror',x=>e.push(x.message));await p.goto('${U}?cb='+Date.now());await p.waitForTimeout(8000);const v=await p.evaluate(()=>window.TOPS_VER);await b.close();console.log('TOPS_VER',v,'errors',e.length);if(v!=='$V'||e.length){console.error(e.join('\n'));process.exit(1)}})()"
          echo "LIVE: $U shows $V, no page errors" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.mode }}" = "test_rollback" ]; then echo "::error::TEST: live check passed; failing on purpose (test_rollback) to exercise the rollback"; exit 1; fi
      - uses: actions/checkout@v4
        with: { ref: src, path: srcrepo, fetch-depth: 0 }
      - name: Mark live on main and push the bump to src
        run: |
          cd site
          sed -i "s/ prepared version=$V / live version=$V /" RELEASES.log
          git commit -qam "v$V live (release run ${{ github.run_id }})" && git push -q origin HEAD:main || echo "::warning::SYNC: could not mark live on main"
          cd ../srcrepo
          git fetch -q ../src.bundle && git push -q origin FETCH_HEAD:refs/heads/src || { echo "::error::SYNC: src push failed (live and main agree; push src by hand)"; exit 1; }
          echo "src -> $(git rev-parse --short FETCH_HEAD)" >> $GITHUB_STEP_SUMMARY
      - name: Prepare rollback to the last live release
        id: rbprep
        if: failure() && steps.live.outcome == 'failure'
        run: |
          cd site
          L=$(grep " live " RELEASES.log | grep -v "version=$V " | tail -1)
          PREV=$(echo "$L" | grep -o "tag=[^ ]*" | cut -d= -f2); PV=$(echo "$L" | grep -o "version=[^ ]*" | cut -d= -f2)
          [ -n "$PREV" ] && [ -n "$PV" ] || { echo "::error::ROLLBACK: no earlier live release in RELEASES.log; restore by hand"; exit 1; }
          git worktree add -q ../rb "$PREV"
          echo "prev=$PREV" >> $GITHUB_OUTPUT; echo "pv=$PV" >> $GITHUB_OUTPUT
          echo "ROLLBACK to $PREV (v$PV)" >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-pages-artifact@v3
        if: failure() && steps.rbprep.outcome == 'success'
        with: { path: rb, name: rollback }
      - id: rbdeploy
        uses: actions/deploy-pages@v4
        if: failure() && steps.rbprep.outcome == 'success'
        with: { artifact_name: rollback }
      - name: Verify the rollback is live
        id: rbverify
        if: failure() && steps.rbdeploy.outcome == 'success'
        env: { PV: '${{ steps.rbprep.outputs.pv }}', U: '${{ steps.rbdeploy.outputs.page_url }}' }
        run: |
          for i in $(seq 1 36); do g=$(curl -fsS "${U}version.json?cb=$RANDOM$i" | grep -o '"v":"[0-9.]*"' | cut -d'"' -f4); [ "$g" = "$PV" ] && { echo "ROLLBACK LIVE: $U shows $PV" >> $GITHUB_STEP_SUMMARY; exit 0; }; sleep 5; done
          echo "::error::ROLLBACK: version.json never showed $PV (last: $g); restore by hand"; exit 1
      - name: Restore main to the rolled-back release (exact match, fatal)
        # since the Pages Source flip a hand push deploys main as-is (deploy.yml), so main must match what is live;
        # only once the rollback is proven live (if the rollback deploy fails, main and live both still hold v$V)
        if: failure() && steps.rbverify.outcome == 'success'
        env: { PREV: '${{ steps.rbprep.outputs.prev }}' }
        run: |
          set -e
          cd site
          P="index.html version.json next assets img"
          git rm -rq --ignore-unmatch -- $P
          git checkout "$PREV" -- $P
          git diff --cached --quiet "$PREV" -- $P || { echo "::error::ROLLBACK: main site files still differ from $PREV; restore main by hand before any hand push"; exit 1; }
          sed -i "s/ prepared version=$V / failed version=$V /" RELEASES.log
          git add RELEASES.log
          git commit -qm "v$V failed live check; rolled back to $PREV (main site files restored)"
          git push -q origin HEAD:main || { echo "::error::ROLLBACK: push of the restored main failed; main still holds v$V, restore it by hand before any hand push"; exit 1; }
          echo "main restored to $PREV site files ($(git rev-parse --short HEAD))" >> $GITHUB_STEP_SUMMARY
