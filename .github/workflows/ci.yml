# TOPS CI (SHIP-3 fast suite for Hayden's 17:03 ship process; DQ-IDLE-1 speed-up). On every push to a feature branch: build, then the
# fast suite, then any tests/*.js the branch added or changed since src. The result is on the commit: this workflow's check runs
# (green tick / red cross) plus a commit status "tops/fast-suite" ("7/7 passed" or the failing tests). release.yml's author (R3) path
# requires a successful push run of this workflow on the exact commit. Evidence lives in GitHub (job summaries), not in chats.
#
# Speed (19 Nov, 7/7 run 44457680977: 10.5 min = install 2.8 + tests 7.2 one after another):
#  - the tests run in 4 parallel jobs (public repo: 4-core runners, no minute cost), packed by measured time, so the wall time is
#    roughly the slowest test (s3-creator / s3-screens, ~130 s) rather than the sum;
#  - each job runs in the Playwright image for the exact Playwright version the tests use, so Chromium and its system libraries are
#    already there (no 2.8 min browser + apt install).
name: ci
on:
  push:
    branches-ignore: [main, src, gh-pages]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions: { contents: read, statuses: write, actions: read }
env:
  # measured seconds per test (CI run 44457680977); a test not listed counts as 60 s. Used only to balance the shards.
  TEST_SECS: "checkouts.js:1 regress.js:80 asset-refs.js:1 s3-welcome.js:29 s3-screens.js:129 s3-match.js:65 s3-creator.js:130"
  FAST: "checkouts.js regress.js asset-refs.js s3-welcome.js s3-screens.js s3-match.js s3-creator.js"
  SHARDS: 4
jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.pick.outputs.shards }}
      all: ${{ steps.pick.outputs.all }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Pending status
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=pending -f context=tops/fast-suite -f description="fast suite running" -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null
      - name: Pick tests (the fast suite + any tests/*.js the branch changed) and pack them into shards
        id: pick
        run: |
          # every test the branch added, changed or renamed since it left src (not only this push)
          git fetch -q origin src; B=$(git merge-base origin/src HEAD)
          CHANGED=$(git diff --name-only --diff-filter=AMR "$B" HEAD -- 'tests/*.js' | sed 's#^tests/##' | grep -v '^_' || true)
          ALL=""; for t in $FAST $CHANGED; do [ -f "tests/$t" ] || continue; case " $ALL " in *" $t "*) ;; *) ALL="$ALL $t";; esac; done
          echo "tests:$ALL"
          # longest first onto the least-loaded shard
          SH=$(for t in $ALL; do s=60; for kv in $TEST_SECS; do [ "${kv%%:*}" = "$t" ] && s=${kv##*:}; done; echo "$s $t"; done | sort -rn | awk -v n="$SHARDS" '
            { best=0; for(i=1;i<n;i++) if(load[i]<load[best]) best=i; load[best]+=$1; list[best]=list[best]" "$2 }
            END { printf "["; c=0; for(i=0;i<n;i++) if(list[i]!=""){ printf "%s{\"n\":%d,\"tests\":\"%s\",\"secs\":%d}", (c++?",":""), i+1, substr(list[i],2), load[i] } printf "]" }')
          # ChatGPT P1-1: never a silent empty or broken plan
          [ -n "$(echo $ALL)" ] || { echo "::error::no tests selected"; exit 1; }
          echo "$SH" | node -e 'const s=JSON.parse(require("fs").readFileSync(0,"utf8"));const t=s.flatMap(x=>x.tests.split(" "));if(!s.length||t.length!==new Set(t).size)process.exit(1)' || { echo "::error::bad shard plan: $SH"; exit 1; }
          echo "shards=$SH" >> $GITHUB_OUTPUT; echo "all=$(echo $ALL)" >> $GITHUB_OUTPUT; echo "shards: $SH"
  fast:
    needs: pick
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: { image: 'mcr.microsoft.com/playwright:v1.48.2-jammy', options: '--ipc=host' }
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.pick.outputs.shards) }}
    name: fast ${{ matrix.shard.n }} (${{ matrix.shard.tests }})
    defaults: { run: { shell: bash } }   # the Playwright image's default shell is sh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: main, path: _site, fetch-depth: 1 }
      - name: Install three + the matching Playwright package (Chromium is in the image)
        run: |
          git config --global --add safe.directory '*'
          npm i --no-save three@0.128.0 playwright@1.48.2 >/dev/null
      - name: Build (tests/setup.sh)
        run: bash tests/setup.sh
      - name: Run ${{ matrix.shard.tests }}
        id: run
        env: { LIST: '${{ matrix.shard.tests }}' }
        run: |
          set +e; pass=0; n=0; failed=""; : > ci.log
          for t in $LIST; do
            [ -f "tests/$t" ] || continue
            case "$t" in
              regress.js)    args="2" ;;
              asset-refs.js) args="double-out-standalone.html _site ." ;;
              # the S3 tests and any test that takes the build dir ([dir] / <dir> in its usage, or path.resolve(process.argv[2]))
              *) if grep -qE 'usage:.*(\[dir\]|<dir>)|path\.resolve\(process\.argv\[2\]' "tests/$t"; then args="$PWD"; else args=""; fi ;;
            esac
            n=$((n+1)); s=$(date +%s)
            timeout 600 node "tests/$t" $args > "out_$t.log" 2>&1; rc=$?
            last=$(grep -v '^\s*$' "out_$t.log" | tail -1 | cut -c1-160)
            if [ $rc = 0 ]; then pass=$((pass+1)); r=PASS; else r="FAIL($rc)"; failed="$failed $t"; fi
            printf '%-16s %-8s %4ss  %s\n' "${t%.js}" "$r" "$(( $(date +%s)-s ))" "$last" | tee -a ci.log
          done
          for t in $failed; do echo "::group::$t (last 40 lines)"; tail -40 "out_$t.log"; echo "::endgroup::"; done
          { echo "### shard ${{ matrix.shard.n }}: $pass/$n passed"; echo '```'; cat ci.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # the shard's evidence for the status job: every test it ran and whether it passed (ChatGPT P1-1)
          mkdir -p result; awk '{print $1".js "$2}' ci.log > "result/shard-${{ matrix.shard.n }}.txt"
          [ $pass = $n ] && [ $n -gt 0 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'shard-${{ matrix.shard.n }}', path: result/, retention-days: 7 }
  status:
    needs: [pick, fast]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        if: needs.pick.result == 'success'
        with: { pattern: 'shard-*', path: results, merge-multiple: true }
        continue-on-error: true
      - name: Status + summary
        env:
          GH_TOKEN: '${{ github.token }}'
          FAST: '${{ needs.fast.result }}'
          PICK: '${{ needs.pick.result }}'
          ALL: '${{ needs.pick.outputs.all }}'
        run: |
          N=$(echo $ALL | wc -w)
          # the failing shards, from the shard jobs' own names ("fast 2 (s3-screens.js)") and results
          F=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=50" --jq '[.jobs[]|select(.name|startswith("fast "))|select(.conclusion!="success")|.name|capture("\\((?<t>.*)\\)").t]|join(" ")' 2>/dev/null || true)
          # ChatGPT P1-1: green only if every selected test is in the shards' own results exactly once, as PASS
          miss=""; for t in $ALL; do c=$(cat results/shard-*.txt 2>/dev/null | grep -c "^$t PASS$" || true); [ "$c" = 1 ] || miss="$miss $t"; done
          extra=$(cat results/shard-*.txt 2>/dev/null | awk '{print $1}' | sort | uniq -d | tr '\n' ' ')
          if [ "$PICK" = success ] && [ "$FAST" = success ] && [ -z "$miss" ] && [ -z "$extra" ] && [ "$N" -gt 0 ]; then st=success; d="$N/$N passed"; elif [ "$PICK" = success ] && [ "$FAST" = success ]; then st=failure; d="not every test reported a pass:${miss}${extra:+ dup: $extra}"; else st=failure; d="${F:+failing: $F}"; [ -z "$d" ] && d="setup failed (pick=$PICK fast=$FAST)"; fi
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=$st -f context=tops/fast-suite -f description="${d:0:139}" -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null
          echo "### TOPS fast suite: $d · commit \`${GITHUB_SHA::7}\` · branch \`${GITHUB_REF_NAME}\` (per-test times in each shard's summary)" >> "$GITHUB_STEP_SUMMARY"
          [ $st = success ]
