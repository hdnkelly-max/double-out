# TOPS CI (SHIP-3 phase 1; fast suite for the 17:03 ship process). On every push to a feature branch: build, then the fast
# suite, then any tests/*.js the push changed. The result is on the commit: this job's check run (green tick / red cross)
# plus a commit status "tops/fast-suite" ("7/7 passed" or the failing tests), which tools/ship-low.sh requires before a LOW
# (R3) release. Evidence lives in GitHub (job summary), not in chats.
name: ci
on:
  push:
    branches-ignore: [main, src, gh-pages]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions: { contents: read, statuses: write }
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/checkout@v4
        with: { ref: main, path: _site, fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Pending status
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=pending -f context=tops/fast-suite -f description="fast suite running" -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null
      - name: Install three + Playwright Chromium
        run: |
          npm i --no-save three@0.128.0 playwright@1.48.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Build (tests/setup.sh)
        run: bash tests/setup.sh
      - name: Pick tests (the fast suite + any tests/*.js the branch changed)
        id: pick
        run: |
          FAST="checkouts.js regress.js asset-refs.js s3-welcome.js s3-screens.js s3-match.js s3-creator.js"
          # every test the branch added, changed or renamed since it left src (not only this push: ChatGPT P2, 19 Nov)
          git fetch -q origin src; B=$(git merge-base origin/src HEAD)
          CHANGED=$(git diff --name-only --diff-filter=AMR "$B" HEAD -- 'tests/*.js' | sed 's#^tests/##' | grep -v '^_' || true)
          ALL=$FAST; for t in $CHANGED; do case " $ALL " in *" $t "*) ;; *) ALL="$ALL $t";; esac; done
          echo "list=$ALL" >> $GITHUB_OUTPUT; echo "changed=$(echo $CHANGED)" >> $GITHUB_OUTPUT
          echo "tests: $ALL"
      - name: Run
        id: run
        env: { LIST: '${{ steps.pick.outputs.list }}' }
        run: |
          set +e; pass=0; n=0; failed=""; : > ci.log
          for t in $LIST; do
            [ -f "tests/$t" ] || continue
            case "$t" in
              regress.js)    args="2" ;;
              asset-refs.js) args="double-out-standalone.html _site ." ;;
              # the S3 tests and any test that takes the build dir ([dir] / <dir> in its usage, or path.resolve(process.argv[2]))
              *) if grep -qE 'usage:.*(\[dir\]|<dir>)|path\.resolve\(process\.argv\[2\]' "tests/$t"; then args="$PWD"; else args=""; fi ;;
            esac
            n=$((n+1)); s=$(date +%s)
            timeout 600 node "tests/$t" $args > "out_$t.log" 2>&1; rc=$?
            last=$(grep -v '^\s*$' "out_$t.log" | tail -1 | cut -c1-160)
            if [ $rc = 0 ]; then pass=$((pass+1)); r=PASS; else r="FAIL($rc)"; failed="$failed $t"; fi
            printf '%-16s %-8s %4ss  %s\n' "${t%.js}" "$r" "$(( $(date +%s)-s ))" "$last" | tee -a ci.log
          done
          echo "pass=$pass" >> $GITHUB_OUTPUT; echo "n=$n" >> $GITHUB_OUTPUT; echo "failed=$(echo $failed)" >> $GITHUB_OUTPUT
          for t in $failed; do echo "::group::$t (last 40 lines)"; tail -40 "out_$t.log"; echo "::endgroup::"; done
          [ $pass = $n ] && [ $n -gt 0 ]
      - name: Status + summary
        if: always()
        env: { GH_TOKEN: '${{ github.token }}', PASS: '${{ steps.run.outputs.pass }}', N: '${{ steps.run.outputs.n }}', FAILED: '${{ steps.run.outputs.failed }}', OUTCOME: '${{ steps.run.outcome }}' }
        run: |
          if [ "$OUTCOME" = success ]; then st=success; d="$PASS/$N passed"; else st=failure; d="${PASS:-0}/${N:-?} passed${FAILED:+; failed: $FAILED}"; [ -z "$N" ] && d="build or setup failed"; fi
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=$st -f context=tops/fast-suite -f description="${d:0:139}" -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null
          { echo "### TOPS fast suite: $d"; echo; echo "commit \`${GITHUB_SHA::7}\` · tree \`$(git rev-parse --short HEAD^{tree})\` · branch \`${GITHUB_REF_NAME}\`"; echo; echo '```'; cat ci.log 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
