<title>TOPS Career Screens</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* TOPS v9 · one component system: card, chip, meter, ring, row, image slot. Single dark look by design.
   Image rules: every slot has a fixed aspect; darts always whole (horizontal strip, 4:1, contain on the shot's own black);
   people/rooms use cover with a set focal point; kit tiles are 1:1 product shots. */
:root{
  --desk:#0a0c0d;--bg:#121517;--card:#1a1e21;--card2:#22272b;--line:#343a3e;--line2:#4a5156;
  --ink:#f3f4f2;--ink2:#c3c8c5;--ink3:#a0a6a3;--red:#d7232d;--red2:#b81c25;--good:#7fd19a;--good2:#3d7a52;--warn:#e7b65a;--bad:#e59b9b;--dartbg:#0e0e0e;
  --d:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--b:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--desk);color:var(--ink);font-family:var(--b);font-size:14px;margin:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px;display:flex;flex-direction:column;align-items:center;gap:12px}
button{font:inherit;color:inherit}
.note{max-width:390px;width:100%;color:var(--ink3);font-size:12px;line-height:1.5}
.phone{position:relative;width:390px;max-width:100%;height:844px;background:var(--bg);border:1px solid #262b2f;border-radius:28px;overflow:hidden;display:flex;flex-direction:column}
@media (max-width:430px){body{padding:0}.phone{width:100%;height:100%;border:0;border-radius:0}}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
/* top bar 56 */
.hd{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:10px;padding:0 6px 0 14px;border-bottom:1px solid var(--line)}
.wm{font-family:var(--d);font-weight:800;font-style:italic;font-size:22px;letter-spacing:.5px}
.me{display:flex;align-items:center;gap:8px;min-width:0;flex:1;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.me .nm{font-weight:600;font-size:15px;white-space:nowrap}
.bank{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.ib{position:relative;width:44px;height:44px;display:grid;place-items:center;background:none;border:0;cursor:pointer;padding:0}
.ib svg{width:22px;height:22px}
.ib .b{position:absolute;top:7px;right:5px;min-width:16px;height:16px;border-radius:8px;background:#5b6266;color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
/* tabs 46 */
.tabs{height:46px;flex:0 0 46px;display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;color:var(--ink3);font-family:var(--d);font-weight:700;font-size:13px;letter-spacing:.4px;text-transform:uppercase;cursor:pointer;position:relative;padding:0;min-width:0}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:18%;right:18%;bottom:-1px;height:3px;background:var(--red);border-radius:2px}
.tabs .dot,.seg .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink);margin-left:4px;vertical-align:3px}
/* screen */
.scr{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:12px;padding:12px 16px 24px}
.scr>*{flex-shrink:0}
/* COMPONENTS */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
button.card{text-align:left;cursor:pointer;width:100%}
button.card:active,.row:active{background:var(--card2)}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sh h3{margin:0;font-size:12px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--ink3)}
.sh a,.sh .lk{font-size:13px;color:var(--ink2);text-decoration:none;background:none;border:0;cursor:pointer;padding:6px 0;min-height:32px}
.big{font-family:var(--d);font-weight:800;line-height:.95;letter-spacing:.3px;text-transform:uppercase}
.t1{font-family:var(--d);font-weight:800;font-size:22px;line-height:1;text-transform:uppercase;letter-spacing:.3px}
.t2{font-size:15px;font-weight:600}
.sub{font-size:13px;color:var(--ink2)}
.num{font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:13px;background:var(--card2);border:1px solid var(--line);font-size:12.5px;font-weight:600;white-space:nowrap;color:var(--ink)}
.chip.g{color:var(--good);border-color:#2e5a3d;background:#16261c}
.chip.w{color:var(--warn);border-color:#5b4a26;background:#2a2316}
.chip.l{color:var(--ink2)}
.chip svg{width:13px;height:13px}
/* meter: segmented bar; .f fill, .gh ghost (kit effect / reward to come), .tg target tick */
.meter{position:relative;height:10px;display:flex;gap:2px}
.meter i{flex:1;border-radius:2px;background:#2b3135}
.meter i.f{background:var(--good)}
.meter i.gh{background:repeating-linear-gradient(135deg,#7fd19a 0 3px,#2f5a3e 3px 6px)}
.meter i.cur{background:#7d868b}
.mtk{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.mlab{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
/* continuous bar */
.bar{position:relative;height:8px;border-radius:4px;background:#2b3135;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--good)}
.bar i.prev{background:#4a5156}
/* ring */
.ring{position:relative;width:64px;height:64px;flex:0 0 64px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--d);font-weight:800;font-size:24px;line-height:1}
.ring small{position:absolute;left:0;right:0;bottom:9px;text-align:center;font-size:9px;letter-spacing:1px;color:var(--ink3);text-transform:uppercase}
/* row: [slot] title/sub [right] chevron */
.row{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;width:100%;text-align:left;cursor:pointer}
.row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .tx small{font-size:12px;color:var(--ink3);text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.chev{color:var(--ink3);font-size:22px;line-height:1;flex:0 0 auto}
/* image slots (fixed aspect) */
.slot{position:relative;overflow:hidden;background:#0d0f10;flex:0 0 auto}
.slot>.im{position:absolute;inset:0;background-size:cover;background-position:50% 50%;background-repeat:no-repeat}
.slot.dart{aspect-ratio:4/1;background:var(--dartbg)}.slot.dart>.im{background-size:contain}
.slot.sq{aspect-ratio:1/1}
.slot.wide{aspect-ratio:16/9}
.slot.r8{border-radius:8px}
.face{width:40px;height:40px;flex:0 0 40px;border-radius:50%;background-size:cover;background-position:50% 40%;border:1px solid var(--line2)}
/* hero */
.hero{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#0e1012;flex:0 0 auto}
.hero .im{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat}
.hero .sh2{position:absolute;inset:0}
.hero .tx{position:absolute;left:14px;right:14px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.kick{font-size:12px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;color:var(--ink2)}
.primary{height:56px;flex:0 0 56px;width:100%;border:0;border-radius:12px;background:var(--red);color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.primary:hover{background:var(--red2)}.primary b{font-family:var(--d);font-weight:800;font-size:22px;letter-spacing:1px;text-transform:uppercase;line-height:1}.primary small{font-size:12px;opacity:.92}
.primary[disabled]{background:#3a3f43;color:#9aa1a5;cursor:default}
.ghost{height:44px;padding:0 16px;border-radius:10px;border:1px solid #6b7276;background:none;font-weight:600;cursor:pointer}
.link{background:none;border:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-size:14px;cursor:pointer;min-height:44px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;height:40px;flex:0 0 40px}
.seg button{flex:1;background:none;border:0;color:var(--ink3);font-size:13px;font-weight:600;cursor:pointer;min-width:0}
.seg button[aria-selected="true"]{background:var(--card2);color:var(--ink)}
/* two-sided compare (head-to-head) */
.h2h{display:grid;grid-template-columns:40px 1fr 40px;gap:10px;align-items:center}
.vs2{display:flex;flex-direction:column;gap:5px}
.vs2 .nums{display:flex;justify-content:space-between;align-items:baseline}
.vs2 .nums b{font-family:var(--d);font-size:24px;font-weight:800;line-height:1}
.vs2 .nums span{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.8px}
.tug{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px}.tug i{display:block;height:100%}.tug .a{background:var(--good)}.tug .b{background:#6b7276}
/* compare rows (current vs this dart) */
.cmp{display:grid;grid-template-columns:78px 1fr 46px;gap:10px;align-items:center;font-size:13.5px}
.cmp .bars{display:flex;flex-direction:column;gap:3px}
.cmp .d{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.d.up{color:var(--good)}.d.dn{color:var(--bad)}.d.eq{color:var(--ink3)}
/* lock panel */
.lock{display:flex;gap:12px;align-items:center}
.lock .ic{width:44px;height:44px;flex:0 0 44px;border-radius:50%;background:var(--card2);border:1px solid var(--line2);display:grid;place-items:center}
.lock .ic svg{width:20px;height:20px}
/* position dots */
.pos{display:flex;gap:4px;align-items:center;align-self:flex-start}.pos i{flex:0 0 14px;width:14px;height:14px;border-radius:50%;background:#2b3135;display:grid;place-items:center;font-size:9px;font-style:normal;font-weight:700;color:var(--ink3)}
.pos i.up{background:#24412e}.pos i.me{background:var(--ink);color:#111}.pos .cut{width:2px;height:16px;background:var(--good);border-radius:1px}
/* table */
.tbl{display:flex;flex-direction:column}
.tbl .tr{display:grid;grid-template-columns:24px 1fr 28px 34px;gap:8px;align-items:center;min-height:38px;font-size:14px;border-top:1px solid #262b2f}
.tbl .tr:first-child{border-top:0}
.tbl .tr.me{background:var(--card2);margin:0 -8px;padding:0 8px;border-radius:8px;font-weight:700}
.tbl .tr .p{color:var(--ink3);font-variant-numeric:tabular-nums}.tbl .tr .r{text-align:right;font-variant-numeric:tabular-nums}
.tbl .cutl{height:0;border-top:1px dashed var(--good2);margin:2px 0;position:relative}
.tbl .cutl span{position:absolute;right:0;top:-9px;font-size:11px;color:var(--good);background:var(--card);padding-left:6px}
/* road */
.road{display:flex;align-items:center;gap:0}
.road .st{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:0}
.road .st i{width:14px;height:14px;border-radius:50%;background:#2b3135;border:2px solid #2b3135}
.road .st.done i{background:var(--good);border-color:var(--good)}.road .st.now i{background:var(--bg);border-color:var(--ink);width:18px;height:18px}
.road .st span{font-size:10.5px;color:var(--ink3);text-align:center;line-height:1.15}.road .st.now span{color:var(--ink);font-weight:700}
.road .ln{flex:0 0 8px;height:2px;background:#2b3135;margin-bottom:16px}
/* stat bars (locker) */
.stt{display:grid;grid-template-columns:86px 1fr 26px 30px;gap:8px;align-items:center;font-size:14px}
.stt b{text-align:right;font-variant-numeric:tabular-nums}
.plus{width:30px;height:30px;border-radius:8px;border:1px solid #2e5a3d;background:#16261c;color:var(--good);font-weight:800;cursor:pointer;padding:0}
.plus[disabled]{visibility:hidden}
/* thumbs */
.thumbs{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:2px}.thumbs::-webkit-scrollbar{display:none}
.th{flex:0 0 132px;scroll-snap-align:start;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:6px 6px 8px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left}
.th[aria-pressed="true"]{border:2px solid #fff;padding:5px 5px 7px}
.th small{font-size:12px;font-weight:600;display:flex;gap:4px;align-items:center}
.th.lk .slot{opacity:.45}
/* stat tiles */
.tile4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tl{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px}
.tl b{font-family:var(--d);font-size:32px;font-weight:800;line-height:1}
.tl small{font-size:12px;color:var(--ink3);text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.tl span{font-size:12.5px}
/* cards grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cd{aspect-ratio:2/3;border-radius:8px;overflow:hidden;border:1px solid var(--line);position:relative;background:#101214}
.cd .im{position:absolute;inset:0;background-size:cover;background-position:50% 50%}
.cd .n{position:absolute;left:0;right:0;bottom:0;height:24px;line-height:24px;padding:0 8px;font-size:11px;font-weight:600;background:rgba(12,14,16,.88);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd.out{display:grid;place-items:center;color:#5b6266;font-family:var(--d);font-weight:700;font-size:18px;background:repeating-linear-gradient(135deg,#14171a 0 8px,#171b1e 8px 16px)}
.fchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-right:-16px;padding-right:24px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 20px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 20px),transparent)}.fchips::-webkit-scrollbar{display:none}
.fchips button{flex:0 0 auto;height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:none;color:var(--ink2);font-size:13px;cursor:pointer}
.fchips button[aria-pressed="true"]{background:var(--card2);color:var(--ink);border-color:var(--line2)}
/* result lockup */
.lockup{position:absolute;right:12px;top:0;bottom:0;width:140px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;text-align:center}
.lockup small{font-size:22px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
.lockup b{font-family:var(--d);font-weight:800;font-size:58px;line-height:.9}
.lockup span{font-size:13px;color:var(--ink2)}
.pin{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding-top:12px;margin-top:auto}
.empty{grid-column:1/-1;color:var(--ink2);font-size:13px;text-align:center;padding:10px}
/* overlays */
.ov{position:absolute;inset:0;z-index:30;background:rgba(6,7,8,.84);display:flex;align-items:center;justify-content:center;padding:22px}
.pc{width:100%;max-width:330px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.pc .pi{aspect-ratio:2/3;max-height:470px;width:100%;background-size:cover;background-position:50% 20%;position:relative}
.pc .pt{position:absolute;left:0;right:0;bottom:0;padding:44px 16px 14px;background:linear-gradient(transparent,rgba(8,9,10,.94));display:flex;flex-direction:column;gap:6px}
.pc .pb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.menu{position:absolute;inset:56px 0 0;z-index:40;background:rgba(6,7,8,.6);display:flex;justify-content:flex-end;align-items:flex-start}
.menu .mc{width:250px;margin:8px 10px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.menu button{min-height:44px;text-align:left;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:14px;cursor:pointer}
.toast{position:absolute;left:16px;right:16px;bottom:24px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.legend{max-width:390px;width:100%;display:flex;flex-wrap:wrap;gap:6px}
.legend button{height:32px;padding:0 12px;border-radius:16px;border:1px solid #2a2f33;background:#15181b;color:var(--ink2);font-size:12px;cursor:pointer}
@media (max-width:430px){.note,.legend{display:none!important}}
</style>

<p class="note"><b>TOPS · career screens, round 4 (v9).</b> Clickable at phone size. Every section rebuilt from one component set (card, chip, meter, ring, row, image slot). Prototype states: the ≡ menu (or the buttons below on desktop).</p>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const money=n=>'$'+n.toLocaleString();
const IC={lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',

/* ---------- state (one model) ---------- */
const DARTS=[
 {id:'assassin',b:'Harrows',n:'Club Brass 22g',line:'Brass starter set. Where everyone begins.',lv:1,price:0,sc:0,co:0,w:22},
 {id:'supergrip',b:'Harrows',n:'Supergrip Ultra 22g',line:'Ringed tungsten, holds in a sweaty hand.',lv:8,price:95,sc:2,co:3,w:22,isNew:1},

 {id:'vapor8',b:'Target',n:'Vapor8 21g',line:'Slim, light, loves the treble.',lv:18,price:150,sc:5,co:3,w:21},
 {id:'zen',b:'Shot',n:'Zen Jutsu 23g',line:'Front-loaded tungsten, ringed grip.',lv:25,price:170,sc:7,co:7,w:23},

 {id:'littler',b:'Target',n:'Littler Gen 1 23g',line:'Sponsor set. Comes with a sponsor deal, never sold.',lv:0,price:0,sc:10,co:9,w:23,sponsor:1}];

 const head=`<div class="hero" style="height:250px"><div class="im" style="background-image:url(img/${L?'g_result_loss.jpg':'g_result_win.jpg'});background-position:22% 30%"></div><div class="sh2" style="background:linear-gradient(270deg,rgba(10,12,14,.9) 0,rgba(10,12,14,.35) 45%,rgba(10,12,14,0) 70%)"></div><div class="lockup"><small style="color:${L?'var(--ink2)':'var(--ink)'}">${L?'Lost':'Won'}</small><b class="num">${M?'1–0':L?'1–2':'2–1'}</b><span>${M?'Back-room money match':'vs '+(E?'Barney':'Big Mal')}</span></div></div>`;
 const me=M?55:L?41:51,op=M?48:44;
 const h2h=`<div class="card" style="gap:8px"><div class="h2h"><span class="face" style="background-image:url(img/g_face_me.jpg)"></span><div class="vs2"><div class="nums"><b class="num">${me}</b><span>Match average</span><b class="num">${op}</b></div><div class="tug"><i class="a" style="width:${me/(me+op)*100}%"></i><i class="b" style="width:${op/(me+op)*100}%"></i></div></div><span class="face" style="background-image:${E?'url(img/g_exh_barney_poster.jpg);background-size:240%;background-position:50% 16%':M?'none;background-color:#2b3135':'url(img/g_face_mal.jpg)'}"></span></div><div class="chips" style="justify-content:center">${chip('Checkout '+(L?'22%':'38%'),'l')}${chip(L?'Best visit 100':'Two tons','l')}</div></div>`;
 const rewards=`<div class="card">${sh(L?'Match summary':'Rewards')}<div style="display:flex;align-items:center;gap:14px"><div class="ring" id="rRing">${ring(pct(),S.xp.lv)}</div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="display:flex;gap:10px;align-items:baseline"><span class="big num" id="rCash" style="font-size:32px;color:var(--good)">+$${r.cash}</span><span class="t2 num" id="rXp">+${r.xp} XP</span></div><span class="sub">${up?'<b style="color:var(--good)">Level up · '+S.xp.lv+'</b> · ':''}${S.xp.need-S.xp.cur} XP to level ${S.xp.lv+1}</span></div></div></div>`;
 const want=L?row({k:'Work on',t:'Practise doubles',s:'Round the Clock · free · small XP',left:`<span class="lock"><span class="ic">${IC.dart}</span></span>`,go:'practice'}):M?row({k:'Entry',t:'Entry money sorted',s:'Walk on is open',left:`<span class="lock"><span class="ic" style="color:var(--good)">${IC.cash}</span></span>`,go:'tonight'}):
  `<button class="row" type="button" data-go="shop" data-sel="razor" style="flex-direction:column;align-items:stretch;gap:8px"><span style="display:flex;align-items:center;gap:12px"><div class="slot dart r8" style="width:110px;flex:0 0 110px"><div class="im" style="background-image:url(img/g_ds_razor.jpg)"></div></div><span class="tx"><small>Next dart</small><span class="t2">Razor Edge · $45 to go</span></span><span class="chev">›</span></span><div class="bar"><i style="width:${(120-45)/120*100}%"></i></div></button>`;
 const pack=S.packs?`<div class="row" style="cursor:default"><div class="slot sq r8" style="width:48px"><div class="im" style="background-image:url(img/g_pack.jpg)"></div></div><span class="tx"><small>Earned</small><span class="t2">1 card pack</span></span><button class="ghost" type="button" id="rOpen">${S.rOpened?'Opened':'Open'}</button></div>`:'';
 const tbl=M||E?row({k:'Season',t:'Table unchanged',s:M?'Money matches don’t count':'Exhibitions don’t count',go:'season'}):`<button class="row" type="button" data-go="season"><span class="tx"><small>Season</small><span class="t2">${L?'Now 4th · 2 pts off 2nd':'Now 2nd · top two go up'}</span></span><span class="chip ${L?'':'g'}" style="${L?'color:var(--bad)':''}">${L?IC.dn+' 1':IC.up+' 1'}</span><span class="chev">›</span></button>`;
 return head+h2h+rewards+want+pack+tbl+`<button class="link" type="button" id="rMsgs" style="align-self:center;color:var(--ink2)">✉ 2 new · Full match stats ›</button><div class="pin"><button class="primary" type="button" id="cont"><b>Continue</b></button></div>`;}
function practice(){return `<div class="hero" style="height:180px"><div class="im" style="background-image:url(img/g_locker.jpg);background-position:30% 40%;filter:brightness(.7)"></div><div class="tx"><span class="kick">Practice · free</span><span class="big" style="font-size:34px">Round the Clock</span><div class="chips">${chip('Doubles 14%','l')}${chip('+20 XP · capped','g')}</div></div></div><button class="primary" type="button" id="prGo"><b>Start practice</b></button><div class="card"><span class="sub">The Practice tab gets its own round. This stub answers the links that point here.</span></div>`;}
/* ---------- shell ---------- */
const TABS=[['tonight','Tonight'],['season','Season'],['shop','Shop'],['locker','Locker'],['practice','Practice']];
function hdr(){$('#hdRing').innerHTML=ring(pct(),S.xp.lv,30);$('#bank').textContent=money(S.bank);$('#msgN').hidden=!S.msgs;$('#msgN').textContent=S.msgs;}
function render(){const res=S.tab==='result';$('#tabs').hidden=res;
 $('#tabs').innerHTML=TABS.map(([k,n])=>`<button role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${n}${k==='locker'&&(S.pts||S.packs)?'<i class="dot" aria-label="something waiting"></i>':''}</button>`).join('');
 const f={tonight,season,shop,locker,result,practice}[S.tab];$('#main').innerHTML=`<section class="scr" data-scr="${S.tab}">${f()}</section>`;hdr();wire();}
function go(t,keep){S.tab=t;render();if(!keep){const s=$('.scr');if(s)s.scrollTop=0;}if(t==='shop')center();if(t==='result')anim();}
function center(){requestAnimationFrame(()=>{const t=$('#thumbs'),q=t&&t.querySelector('[aria-pressed="true"]');if(q)t.scrollLeft=Math.max(0,q.offsetLeft-t.offsetLeft-(t.clientWidth-q.clientWidth)/2);});}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2000);}
function award(){S.rw=S.mode==='money'?{cash:100,xp:40}:S.lost?{cash:5,xp:100}:S.mode==='exh'?{cash:250,xp:300}:{cash:55,xp:240};S.xp.pre=S.xp.cur;S.xp.preLv=S.xp.lv;S.xp.cur+=S.rw.xp;while(S.xp.cur>=S.xp.need){S.xp.cur-=S.xp.need;S.xp.lv++;S.pts++;}S.rOpened=false;}
function anim(){cancelAnimationFrame(anim.id);if(matchMedia('(prefers-reduced-motion:reduce)').matches||!S.rw)return;const c=$('#rCash'),x=$('#rXp');const C=S.rw.cash,X=S.rw.xp,t0=performance.now();const f=t=>{const k=Math.min(1,(t-t0)/700),e=1-Math.pow(1-k,3);c.textContent='+$'+Math.round(C*e);x.textContent='+'+Math.round(X*e)+' XP';if(k<1)anim.id=requestAnimationFrame(f);};anim.id=requestAnimationFrame(f);}
function openPack(){if(!S.packs)return;S.packs--;const c=CARDS.find(x=>!x[0]);if(c){c[0]='kw_fishchips';c[1]='Fish & Chips';c[2]='House rules';S.coll++;S.set=Math.min(9,S.set+1);}toast('New card: Fish & Chips · Kiwi Pub Life '+S.set+'/9');}
function wire(){
 $$('#tabs button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
 $$('[data-go]').forEach(b=>b.onclick=e=>{e.stopPropagation();if(b.dataset.sel)S.sel=b.dataset.sel;go(b.dataset.go);});
 $$('[data-lk]').forEach(b=>b.onclick=()=>{S.lk=b.dataset.lk;render();});
 $$('[data-soon]').forEach(b=>b.onclick=()=>toast(b.textContent+' gets its own round.'));
 const w=$('#walkOn');if(w)w.onclick=()=>{if(S.broke)return toast('Short of the $40 entry. Play the money match first.');award();go('result');};
 const m=$('#moneyTile');if(m)m.onclick=()=>{S.mode='money';S.lost=false;award();go('result');};
 const c=$('#cont');if(c)c.onclick=()=>{const md=S.mode;S.bank+=S.rw?S.rw.cash:0;if(md==='money')S.broke=false;S.mode='fixture';S.lost=false;go('tonight');toast(md==='money'?'+$100 banked. You can pay the $40 entry now.':md==='exh'?'Exhibition done. Back to the league.':'Next fixture: vs Shazza, week 6');};
 const ro=$('#rOpen');if(ro)ro.onclick=()=>{if(S.rOpened)return;openPack();S.rOpened=true;render();};
 $$('.th').forEach(b=>b.onclick=()=>{S.sel=b.dataset.id;render();center();});
 const by=$('#sBuy');if(by)by.onclick=()=>{const d=DARTS.find(x=>x.id===S.sel);if(S.bank<d.price)return render();S.bank-=d.price;S.owned[d.id]=1;S.eq=d.id;render();toast(d.n+' bought and equipped.');};
 const eq=$('#sEquip');if(eq)eq.onclick=()=>{S.eq=S.sel;render();};
 const tr=$('#sTry');if(tr)tr.onclick=()=>toast('Free practice session with this dart. No XP or money from it.');
 const op=$('#openPack');if(op)op.onclick=()=>{openPack();render();};
 $$('.fchips button').forEach(b=>b.onclick=()=>{S.cardF=b.textContent.split(' ·')[0];render();});
 $$('.plus').forEach(b=>b.onclick=()=>{if(!S.pts)return;S.st[b.dataset.st]++;S.pts--;render();toast(S.pts?S.pts+' point left':'All points spent');});
 const tc=$('#toCards');if(tc)tc.onclick=()=>{S.lk='cards';render();};
 const ks=$('#kitShirt');if(ks)ks.onclick=()=>toast('Shirts get their own Shop round.');
 const pg=$('#prGo');if(pg)pg.onclick=()=>toast('Practice starts here (next round).');
 const rm=$('#rMsgs');if(rm)rm.onclick=()=>toast('Full stats: 3 tons, best visit 140, checkout 3 of 8.');}
$('#meBtn').onclick=()=>{S.lk='load';go('locker');};
$('#msgBtn').onclick=()=>{S.msgs=0;hdr();toast('Big Mal: see you on the oche. Club secretary: subs due Friday.');};
const STATES=[['normal','Normal'],['first','First match'],['broke','Can’t afford entry'],['lost','Lost match'],['exh','Exhibition night']];
function setState(k){$$('.ov').forEach(e=>e.remove());S.xp={lv:14,cur:560,need:900,pre:320,preLv:14};S.pts=2;S.packs=3;S.rw=null;S.first=k==='first';S.broke=k==='broke';S.bank=S.broke?25:640;S.lost=k==='lost';S.mode=k==='exh'?'exh':'fixture';
 if(k==='lost'){award();go('result');}else{go('tonight');if(k==='exh')poster();}}
function poster(){const p=document.createElement('div');p.className='ov';p.innerHTML=`<div class="pc" role="dialog" aria-label="Exhibition invite"><div class="pi" style="background-image:url(img/g_exh_barney_poster.jpg)"><div class="pt"><span class="kick">Exhibition · Friday · the Club</span><span class="big" style="font-size:34px">Barney is in town</span><div class="chips">${chip('Best of 3')}${chip('$250 prize','g')}${chip('3 tries','l')}</div></div></div><div class="pb"><button class="primary" type="button" id="pGo"><b>Take him on</b></button><button class="link" type="button" id="pLater">Not tonight</button></div></div>`;$('#phone').appendChild(p);
 $('#pGo').onclick=()=>p.remove();$('#pLater').onclick=()=>{p.remove();S.mode='fixture';render();};}
$('.legend').innerHTML=STATES.map(([k,n])=>`<button type="button" data-s="${k}">${n}</button>`).join('');$$('.legend button').forEach(b=>b.onclick=()=>setState(b.dataset.s));
$('#menuBtn').onclick=()=>{if($('.menu'))return $('.menu').remove();const m=document.createElement('div');m.className='menu';m.innerHTML='<div class="mc" role="dialog" aria-label="Menu"><span class="kick">Prototype states</span>'+STATES.map(([k,n])=>`<button type="button" data-s="${k}">${n}</button>`).join('')+'<span class="kick" style="margin-top:8px">Game</span><button type="button">Settings · How to throw · Credits</button></div>';$('#phone').appendChild(m);m.onclick=e=>{const t=e.target.closest('button');if(e.target===m)return m.remove();if(!t)return;m.remove();if(t.dataset.s)setState(t.dataset.s);else toast('Not part of this prototype.');};};
window.TOPS9={S,go,setState,render,award};
render();
</script>
